services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: vetagenda
      POSTGRES_USER: vetagenda
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vetagenda-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetagenda -d vetagenda"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vetagenda-db:
