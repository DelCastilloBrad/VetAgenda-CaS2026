<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Crear cuenta')}"></head>
  <body class="auth-page registration">
    <main class="auth-form" id="main">
      <a class="brand" th:href="@{/login}"
        ><span class="brand-icon">✚</span><span>VetAgenda</span></a
      >
      <h1>Empieza a cuidarlos mejor</h1>
      <p class="subtitle">
        Crea tu cuenta para reservar y consultar sus historias.
      </p>
      <form th:action="@{/registro}" method="post" class="stack">
        <label for="name">Nombre completo</label
        ><input
          id="name"
          name="name"
          maxlength="100"
          autocomplete="name"
          required
        />
        <div class="form-grid">
          <div>
            <label for="dni">DNI</label
            ><input
              id="dni"
              name="dni"
              pattern="[0-9]{8}"
              maxlength="8"
              inputmode="numeric"
              required
            />
          </div>
          <div>
            <label for="phone">Celular</label
            ><input
              id="phone"
              name="phone"
              pattern="[0-9]{9}"
              maxlength="9"
              inputmode="tel"
              autocomplete="tel"
              required
            />
          </div>
        </div>
        <label for="email">Correo electrónico</label
        ><input
          id="email"
          name="email"
          type="email"
          maxlength="150"
          autocomplete="email"
          required
        /><label for="password">Contraseña</label
        ><input
          id="password"
          name="password"
          type="password"
          minlength="10"
          maxlength="72"
          autocomplete="new-password"
          required
        /><small>Al menos 10 caracteres; máximo 72 bytes.</small
        ><label class="checkbox-label"
          ><input
            id="consent"
            name="consent"
            type="checkbox"
            value="true"
            required
          />
          Autorizo el uso de mis datos para gestionar mis citas y el historial
          de mis mascotas.</label
        ><button class="btn btn-primary" id="register-submit">
          Crear cuenta →
        </button>
      </form>
      <p class="auth-switch">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
      </p>
    </main>
  </body>
</html>
