spring.application.name=VetAgenda
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vetagenda}
spring.datasource.username=${DB_USER:vetagenda}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.thymeleaf.cache=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
vetagenda.demo.enabled=false
vetagenda.theme-directory=${THEME_DIRECTORY:./config/theme}
